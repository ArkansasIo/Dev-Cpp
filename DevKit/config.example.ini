# DevKit configuration for Dev-C++ companion toolkit
# Copy this file to config.ini and fill in your real values.

[general]
install_root = C:\DevKit
top_n = 25

[wolfram]
# Free AppID: https://developer.wolframalpha.com/portal/
appid = YOUR_WOLFRAM_APPID
output = plaintext
timeout_seconds = 20

[mysql]
host = 127.0.0.1
port = 3306
root_password = CHANGE_ME
database = devkit_db
user = devkit_user
user_password = CHANGE_ME

[cronjobs]
# Windows Task Scheduler jobs created by cron_setup.ps1
# Format: name = schedule|command   (schedules: @hourly, daily:HH:MM, every:Nm)
backup_db = daily:02:00|powershell -NoProfile -ExecutionPolicy Bypass -File C:\DevKit\tools\mysql_backup.ps1
cleanup_temp = daily:03:30|powershell -NoProfile -Command "Remove-Item $env:TEMP\* -Recurse -Force -ErrorAction SilentlyContinue"
ping_log = every:15m|powershell -NoProfile -Command "Get-Date; Test-Connection 8.8.8.8 -Count 1 | Out-File C:\DevKit\logs\ping.log -Append"
